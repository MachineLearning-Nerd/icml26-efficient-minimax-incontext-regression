[project]
name = "icml26-repro-3hd1gzthty"
version = "0.1.0"
description = "CPU-only, SHA-bound reproduction of arXiv 2601.15014 (Efficient and Minimax Optimal In-context Nonparametric Regression with Transformers)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.8,<4.0",
    "pandas>=2.1,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["repro/tests"]
addopts = "-q"
pythonpath = ["."]

# Dependency-only project: `python -m repro.run` runs from the repo root
# (CWD is on sys.path), so the `repro` package needs no build/install step.
[tool.uv]
package = false
